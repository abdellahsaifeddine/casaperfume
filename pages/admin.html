<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — CASAPERF</title>
  <link rel="icon" href="../images/favicon.png" type="image/png">
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --accent: #d4af37;
      --accent2: #c084fc;
      --text: #f0f0f0;
      --muted: #666;
      --green: #4ade80;
      --red: #f87171;
      --blue: #60a5fa;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
    }

    /* LOGIN */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 50%, #1a1200 0%, #0a0a0a 70%);
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem;
      width: 360px;
      text-align: center;
    }

    .login-box .logo {
      font-size: 1.1rem;
      letter-spacing: 0.3em;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .login-box h2 {
      font-size: 1.5rem;
      margin-bottom: 2rem;
      color: var(--muted);
      font-weight: 400;
    }

    .login-box input {
      width: 100%;
      padding: 1rem;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 1rem;
      margin-bottom: 1rem;
      outline: none;
      transition: border 0.2s;
    }

    .login-box input:focus { border-color: var(--accent); }

    .login-box button {
      width: 100%;
      padding: 1rem;
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 10px;
      font-family: 'Syne', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .login-box button:hover { opacity: 0.85; }
    .login-error { color: var(--red); font-size: 0.85rem; margin-top: 0.5rem; }

    /* DASHBOARD */
    #dashboard { display: none; }

    header {
      border-bottom: 1px solid var(--border);
      padding: 1.2rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
    }

    header .logo { font-size: 0.9rem; letter-spacing: 0.3em; color: var(--accent); font-weight: 700; }
    header .subtitle { color: var(--muted); font-size: 0.8rem; font-family: 'DM Mono', monospace; }

    .refresh-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      font-family: 'Syne', sans-serif;
      cursor: pointer;
      font-size: 0.85rem;
      transition: border-color 0.2s;
    }

    .refresh-btn:hover { border-color: var(--accent); color: var(--accent); }

    .container { padding: 2rem; max-width: 1400px; margin: 0 auto; }

    /* STATS CARDS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .stat-card:hover { border-color: #333; }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
    }

    .stat-card.views::before { background: var(--blue); }
    .stat-card.carts::before { background: var(--green); }
    .stat-card.orders::before { background: var(--accent); }
    .stat-card.today::before { background: var(--accent2); }

    .stat-label {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-family: 'DM Mono', monospace;
      margin-bottom: 0.8rem;
    }

    .stat-value {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1;
    }

    .stat-card.views .stat-value { color: var(--blue); }
    .stat-card.carts .stat-value { color: var(--green); }
    .stat-card.orders .stat-value { color: var(--accent); }
    .stat-card.today .stat-value { color: var(--accent2); }

    /* GRID 2 COL */
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    @media (max-width: 768px) { .grid-2 { grid-template-columns: 1fr; } }

    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
    }

    .panel-title {
      font-size: 0.75rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      font-family: 'DM Mono', monospace;
      margin-bottom: 1.2rem;
    }

    /* PARFUM BARS */
    .parfum-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1rem;
    }

    .parfum-name {
      font-size: 0.85rem;
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .parfum-bar-wrap {
      flex: 2;
      background: var(--border);
      border-radius: 99px;
      height: 6px;
      overflow: hidden;
    }

    .parfum-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--green), var(--accent));
      border-radius: 99px;
      transition: width 0.8s ease;
    }

    .parfum-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--green);
      min-width: 24px;
      text-align: right;
    }

    /* PAGES LIST */
    .page-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.85rem;
    }

    .page-item:last-child { border-bottom: none; }
    .page-url { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.75rem; }
    .page-count { font-family: 'DM Mono', monospace; color: var(--blue); }

    /* EVENTS TABLE */
    .events-panel { margin-bottom: 2rem; }

    .events-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .events-table th {
      text-align: left;
      padding: 0.6rem 1rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      border-bottom: 1px solid var(--border);
    }

    .events-table td {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid #1a1a1a;
    }

    .events-table tr:hover td { background: #151515; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 99px;
      font-size: 0.7rem;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
    }

    .badge.page_view { background: #1e3a5f; color: var(--blue); }
    .badge.add_to_cart { background: #14532d; color: var(--green); }
    .badge.click_commander { background: #422006; color: var(--accent); }

    .time-text { color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.75rem; }

    .loading {
      text-align: center;
      color: var(--muted);
      padding: 3rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.85rem;
    }

    .empty {
      text-align: center;
      color: var(--muted);
      padding: 2rem;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-box">
    <div class="logo">𝐂 𝐀 𝐒 𝐀 𝐏 𝐄 𝐑 𝐅</div>
    <h2>Dashboard Admin</h2>
    <input type="password" id="pwd-input" placeholder="Mot de passe admin..." onkeydown="if(event.key==='Enter') login()">
    <button onclick="login()">Accéder</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <header>
    <div>
      <div class="logo">𝐂 𝐀 𝐒 𝐀 𝐏 𝐄 𝐑 𝐅 — ADMIN</div>
      <div class="subtitle" id="last-updated">Chargement...</div>
    </div>
    <button class="refresh-btn" onclick="loadData()">↻ Actualiser</button>
  </header>

  <div class="container">

    <!-- STATS -->
    <div class="stats-grid">
      <div class="stat-card views">
        <div class="stat-label">Pages vues (total)</div>
        <div class="stat-value" id="stat-views">—</div>
      </div>
      <div class="stat-card carts">
        <div class="stat-label">Ajouts panier</div>
        <div class="stat-value" id="stat-carts">—</div>
      </div>
      <div class="stat-card orders">
        <div class="stat-label">Clics Commander</div>
        <div class="stat-value" id="stat-orders">—</div>
      </div>
      <div class="stat-card today">
        <div class="stat-label">Visites aujourd'hui</div>
        <div class="stat-value" id="stat-today">—</div>
      </div>
    </div>

    <!-- PARFUMS + PAGES -->
    <div class="grid-2">
      <div class="panel">
        <div class="panel-title">🛒 Parfums les plus ajoutés au panier</div>
        <div id="parfums-list"><div class="loading">Chargement...</div></div>
      </div>
      <div class="panel">
        <div class="panel-title">👁️ Pages les plus visitées</div>
        <div id="pages-list"><div class="loading">Chargement...</div></div>
      </div>
    </div>

    <!-- EVENTS TABLE -->
    <div class="panel events-panel">
      <div class="panel-title">📋 Derniers événements (50)</div>
      <div id="events-table"><div class="loading">Chargement...</div></div>
    </div>

  </div>
</div>

<script>
  const SUPABASE_URL = "https://rzfeetzksgdiqcgybeou.supabase.co";
  const SUPABASE_KEY = "sb_publishable_Z5v_4w-e3Qq7DgDLyJ5oHw_sL3eSaGc";
  const ADMIN_PASSWORD = "Casaperfum123@..";

  function login() {
    const pwd = document.getElementById('pwd-input').value;
    if (pwd === ADMIN_PASSWORD) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadData();
    } else {
      document.getElementById('login-error').textContent = 'Mot de passe incorrect.';
    }
  }

  async function fetchData(query) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${query}`, {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`
      }
    });
    return res.json();
  }

  async function loadData() {
    try {
      // Récupérer tous les events
      const events = await fetchData('events?select=*&order=created_at.desc&limit=500');

      // Stats globales
      const views = events.filter(e => e.type === 'page_view').length;
      const carts = events.filter(e => e.type === 'add_to_cart').length;
      const orders = events.filter(e => e.type === 'click_commander').length;

      // Visites aujourd'hui
      const today = new Date().toISOString().split('T')[0];
      const todayViews = events.filter(e => e.type === 'page_view' && e.created_at.startsWith(today)).length;

      document.getElementById('stat-views').textContent = views;
      document.getElementById('stat-carts').textContent = carts;
      document.getElementById('stat-orders').textContent = orders;
      document.getElementById('stat-today').textContent = todayViews;

      // Parfums les plus ajoutés
      const parfumCount = {};
      events.filter(e => e.type === 'add_to_cart' && e.parfum).forEach(e => {
        parfumCount[e.parfum] = (parfumCount[e.parfum] || 0) + 1;
      });
      const parfumsSorted = Object.entries(parfumCount).sort((a,b) => b[1]-a[1]);
      const maxParfum = parfumsSorted[0]?.[1] || 1;

      const parfumsList = document.getElementById('parfums-list');
      if (parfumsSorted.length === 0) {
        parfumsList.innerHTML = '<div class="empty">Aucun ajout au panier encore</div>';
      } else {
        parfumsList.innerHTML = parfumsSorted.slice(0,7).map(([name, count]) => `
          <div class="parfum-item">
            <div class="parfum-name">${name}</div>
            <div class="parfum-bar-wrap">
              <div class="parfum-bar" style="width:${(count/maxParfum)*100}%"></div>
            </div>
            <div class="parfum-count">${count}</div>
          </div>
        `).join('');
      }

      // Pages les plus visitées
      const pageCount = {};
      events.filter(e => e.type === 'page_view' && e.page).forEach(e => {
        const p = e.page.split('/').pop() || 'index.html';
        pageCount[p] = (pageCount[p] || 0) + 1;
      });
      const pagesSorted = Object.entries(pageCount).sort((a,b) => b[1]-a[1]);

      const pagesList = document.getElementById('pages-list');
      if (pagesSorted.length === 0) {
        pagesList.innerHTML = '<div class="empty">Aucune visite encore</div>';
      } else {
        pagesList.innerHTML = pagesSorted.slice(0,8).map(([page, count]) => `
          <div class="page-item">
            <span class="page-url">${page}</span>
            <span class="page-count">${count}</span>
          </div>
        `).join('');
      }

      // Derniers events
      const last50 = events.slice(0, 50);
      const eventsTable = document.getElementById('events-table');
      if (last50.length === 0) {
        eventsTable.innerHTML = '<div class="empty">Aucun événement encore</div>';
      } else {
        eventsTable.innerHTML = `
          <table class="events-table">
            <thead>
              <tr>
                <th>Type</th>
                <th>Parfum</th>
                <th>Prix</th>
                <th>Page</th>
                <th>Date & Heure</th>
              </tr>
            </thead>
            <tbody>
              ${last50.map(e => `
                <tr>
                  <td><span class="badge ${e.type}">${e.type}</span></td>
                  <td>${e.parfum || '—'}</td>
                  <td>${e.prix ? e.prix + ' DH' : '—'}</td>
                  <td class="page-url">${(e.page || '').split('/').pop() || '/'}</td>
                  <td class="time-text">${new Date(e.created_at).toLocaleString('fr-FR')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        `;
      }

      document.getElementById('last-updated').textContent = 'Mis à jour : ' + new Date().toLocaleTimeString('fr-FR');

    } catch(err) {
      console.error(err);
    }
  }

  // Auto-refresh toutes les 60 secondes
  setInterval(loadData, 60000);
</script>

</body>
</html>
